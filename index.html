<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaggi</title>
<meta name="theme-color" content="#F28C28">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viaggi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
:root { --arancio: #F28C28; --azzurro: #D9EEF9; --azzurro-bordo: #B5DAEE; --ink: #16313d; --ink2: #4d6773; --link: #B35400; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hanken Grotesk', system-ui, sans-serif; background: var(--azzurro); color: var(--ink); min-height: 100vh; }
header { background: var(--arancio); padding: calc(env(safe-area-inset-top) + 22px) 20px 22px; display: flex; align-items: center; gap: 14px; }
.logo { width: 64px; height: 64px; border-radius: 16px; background: #ffffff; flex-shrink: 0; }
header h1 { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 38px; letter-spacing: 0.5px; color: var(--ink); text-transform: uppercase; }
header p { margin-top: 4px; font-size: 14px; color: var(--ink); opacity: 0.85; }
main { padding: 20px 16px calc(env(safe-area-inset-bottom) + 28px); display: grid; gap: 14px; max-width: 560px; margin: 0 auto; }
a.trip { display: block; text-decoration: none; color: inherit; background: #ffffff; border: 1px solid var(--azzurro-bordo); border-left: 6px solid var(--arancio); border-radius: 16px; padding: 18px 18px 16px; }
a.trip:active { transform: scale(0.99); }
.trip-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.trip-name { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 30px; text-transform: uppercase; letter-spacing: 0.3px; }
.badge { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--azzurro); border: 1px solid var(--azzurro-bordo); color: var(--ink); white-space: nowrap; }
.badge.live { background: var(--arancio); border-color: var(--arancio); color: var(--ink); }
.trip-dates { margin-top: 6px; font-size: 16px; font-weight: 600; }
.trip-sub { margin-top: 2px; font-size: 14px; color: var(--ink2); }
.trip-go { margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--link); }
</style>
</head>
<body>
<header>
  <img class="logo" src="icon-192.png" alt="" width="64" height="64">
  <div>
    <h1>Viaggi</h1>
    <p>Scegli il viaggio</p>
  </div>
</header>
<main>
  <a class="trip" href="madrid/" data-from="2026-12-28" data-to="2027-01-02">
    <div class="trip-top"><div class="trip-name">Madrid</div><span class="badge"></span></div>
    <div class="trip-dates">28 dicembre – 2 gennaio</div>
    <div class="trip-sub">Capodanno</div>
    <div class="trip-go">Apri il viaggio ›</div>
  </a>
  <a class="trip" href="amsterdam/" data-from="2027-03-27" data-to="2027-03-31">
    <div class="trip-top"><div class="trip-name">Amsterdam</div><span class="badge"></span></div>
    <div class="trip-dates">27 – 31 marzo 2027</div>
    <div class="trip-sub">Pasqua e Pasquetta</div>
    <div class="trip-go">Apri il viaggio ›</div>
  </a>
</main>
<script>
(function () {
  var day = 864e5, now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  document.querySelectorAll('a.trip').forEach(function (a) {
    var from = new Date(a.dataset.from + 'T00:00:00'), to = new Date(a.dataset.to + 'T00:00:00'), b = a.querySelector('.badge');
    if (today < from) { var d = Math.round((from - today) / day); b.textContent = 'Mancano ' + d + (d === 1 ? ' giorno' : ' giorni'); }
    else if (today <= to) { b.textContent = 'In corso'; b.classList.add('live'); }
    else b.textContent = 'Concluso';
  });
})();
</script>
</body>
</html>
